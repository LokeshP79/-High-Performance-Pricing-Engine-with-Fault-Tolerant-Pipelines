apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pricing-engine
  template:
    metadata:
      labels:
        app: pricing-engine
    spec:
      containers:
      - name: pricing-engine
        image: pricing-engine:latest
        ports:
        - containerPort: 80
